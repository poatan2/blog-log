name: Tistory Blog Update

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각마다 실행
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # v2에서 v4로 수정 (Node.js 경고 해결)
      - uses: actions/checkout@v4 
      
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://ta3g.tistory.com/rss"
          max_post_count: 10
          # 핵심 해결책: 티스토리 406 에러를 뚫기 위해 크롬 브라우저인 척 위장
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
