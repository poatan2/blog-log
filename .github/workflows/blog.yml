name: Tistory Blog Update

on:
  schedule:
    # 매일 자정, 정오(한국 시간 오전 9시, 오후 9시)에 새 글이 있는지 확인합니다.
    - cron: '0 * * * *' 
  workflow_dispatch: # 수동으로 실행할 수 있는 버튼을 만들어줍니다.

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          # 아래 주소에 본인 티스토리 RSS 주소를 입력하세요.
          feed_list: "https://ta3g.tistory.com/rss"
          # 가져올 최신 글의 개수를 설정합니다. (기본값은 5개)
          max_post_count: 10
